# Only the TypeScript packages that build with pnpm. The Bun-based opencode
# plugin in modules/llm/opencode/kiro and the skills submodule stay out.
packages:
  - hosts/gram/x-blocklist
  - hosts/pewter/flake-updater

# Written out even though it matches pnpm's default: an explicit value makes
# pnpm fail resolution instead of silently installing a too-new version.
minimumReleaseAge: 1440

catalog:
  "@types/node": ^26.6.6
  typescript: ^7.0.2
  vitest: ^5.1.0

catalogs:
  effect:
    "@effect/platform-node": 4.1.2
    "@effect/vitest": 4.1.2
    effect: 4.1.2
  tooling:
    "@effect/tsgo": ^0.67.4
    "@oxlint/plugins": ~1.91.0
    esbuild: ^0.28.2
    oxfmt: ~0.76.0
    # @effect/tsgo patches oxlint and supports only listed versions; it
    # accepts up to 1.91 as of 0.67.4.
    oxlint: ~1.91.0
    oxlint-tsgolint: ^7.0.2006
    turbo: ^2.11.10

# @opencode/client's schema and protocol packages pin effect as a direct
# dependency. Keep one effect copy so the client's decoded schema values and
# the workspace's runtime come from the same module instances.
overrides:
  effect: 4.1.2

allowBuilds:
  esbuild: true
